<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>WFM Adherence Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070710;--bg1:#0d0d1c;--bg2:#121226;--bg3:#181830;
  --glass:rgba(255,255,255,.035);--glass-h:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.07);--border-s:rgba(255,255,255,.12);
  --text:#eeeef8;--text2:#8080a0;--text3:#4a4a68;
  --accent:#7c5af0;--accent2:#9b7ff8;
  --blue:#3b7ef8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--teal:#14b8a6;
  --r:8px;--r2:12px;--r3:16px;
  --fd:'Syne',sans-serif;--f:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(124,90,240,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(124,90,240,.02) 1px,transparent 1px);background-size:52px 52px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding:20px 24px 60px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-family:var(--fd);font-size:24px;font-weight:800}
.logo span{color:var(--accent2)}
.sub{font-size:12px;color:var(--text2);margin-top:2px}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--glass);border:1px solid var(--border-s);color:var(--text);font-family:var(--f);font-size:13px;font-weight:500;padding:9px 14px;border-radius:var(--r2);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--glass-h);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
select,input{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--f);font-size:13px;padding:8px 10px;border-radius:var(--r);outline:none}
select:focus,input:focus{border-color:var(--accent)}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:30px;padding:4px;margin-bottom:16px;width:fit-content}
.tab{padding:8px 18px;border-radius:24px;border:none;background:transparent;color:var(--text2);font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.tab.active{background:var(--accent);color:#fff}

/* toolbar */
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:12px 16px}
.metricseg{display:flex;gap:2px;background:var(--bg3);border-radius:20px;padding:3px}
.metricseg button{border:none;background:transparent;color:var(--text2);font-family:var(--f);font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:16px;cursor:pointer;transition:all .15s;white-space:nowrap}
.metricseg button.on{background:var(--accent);color:#fff}
.tool-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.spacer{flex:1}

/* matrix */
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r3);overflow:hidden}
.matrix-scroll{overflow:auto;max-height:72vh}
table.matrix{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
table.matrix th,table.matrix td{padding:0;text-align:center;white-space:nowrap}
table.matrix thead th{position:sticky;top:0;z-index:3;background:var(--bg2);color:var(--text2);font-weight:600;font-size:11px;padding:8px 6px;border-bottom:1px solid var(--border-s)}
table.matrix thead th.corner{left:0;z-index:5;text-align:left;padding-left:16px;min-width:180px}
table.matrix thead th.totcol{right:0;z-index:4;background:var(--bg3)}
.dhead{display:flex;flex-direction:column;line-height:1.25}
.dhead .dow{font-size:9.5px;color:var(--text3);text-transform:uppercase}
.dhead.we .dnum{color:var(--amber)}
table.matrix tbody th.agent{position:sticky;left:0;z-index:2;background:var(--bg2);text-align:left;padding:0 16px;font-weight:500;color:var(--text);min-width:180px;max-width:220px;border-bottom:1px solid var(--border);border-right:1px solid var(--border-s)}
table.matrix tbody td{border-bottom:1px solid rgba(255,255,255,.03);border-right:1px solid rgba(255,255,255,.02)}
.cell{display:block;height:38px;line-height:1.1;padding:4px 3px;cursor:pointer;position:relative;transition:filter .12s}
.cell:hover{filter:brightness(1.35)}
.cell .v{font-weight:600;font-size:12px}
.cell .c{font-size:9.5px;color:var(--text2);margin-top:1px}
.cell.clean{color:var(--text3)}
.cell .exc{position:absolute;top:2px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.cell .otdot{position:absolute;top:2px;left:3px;width:5px;height:5px;border-radius:50%;background:var(--teal)}
td.tot,th.tot{position:sticky;right:0;background:var(--bg3);z-index:1;font-weight:600;border-left:1px solid var(--border-s)}
tr.totrow th,tr.totrow td{position:sticky;bottom:0;background:var(--bg2);z-index:2;border-top:1px solid var(--border-s);font-weight:600;color:var(--text)}
tr.totrow th.agent{z-index:6}

/* leaderboard / breakdown */
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{text-align:left;color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:12px 14px;border-bottom:1px solid var(--border-s);position:sticky;top:0;background:var(--bg1)}
table.list td{padding:11px 14px;border-bottom:1px solid var(--border)}
table.list tr:hover td{background:var(--glass)}
.bar{height:6px;border-radius:4px;background:var(--accent);display:inline-block;vertical-align:middle}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}

/* drill modal */
.modal{position:fixed;inset:0;background:rgba(4,4,12,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--bg1);border:1px solid var(--border-s);border-radius:var(--r3);width:640px;max-width:96vw;max-height:88vh;overflow:auto;padding:24px}
.modal-box h3{font-family:var(--fd);font-size:19px;margin-bottom:2px}
.mclose{float:right;cursor:pointer;color:var(--text2);font-size:20px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.kv .k{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.kv .val{font-size:16px;font-weight:600;margin-top:2px}
.timeline{margin-top:8px}
.seg{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);background:var(--glass);margin-bottom:5px;font-size:12px}
.seg .dot{width:9px;height:9px;border-radius:3px;flex:none}
.seg .t{color:var(--text2);font-variant-numeric:tabular-nums}
.seg .nm{flex:1;font-weight:500}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--red);color:#fff;display:inline-block;margin:2px 3px 0 0}
.tag.ok{background:var(--green)}
.tag.info{background:var(--blue)}

/* exceptions form */
.exform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:16px}
.exform label{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text2);margin-top:10px;padding:0 4px}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .sw{width:22px;height:12px;border-radius:3px}

.agentpanel{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:20;width:250px;background:var(--bg2);border:1px solid var(--border-s);border-radius:var(--r2);padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.agentpanel.open{display:block}
.agentpanel input{width:100%;margin-bottom:8px}
.apbtns{display:flex;gap:6px;margin-bottom:8px}
.apbtns .btn{flex:1;padding:6px;text-align:center}
#agentList{max-height:280px;overflow:auto}
.apitem{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:var(--r);cursor:pointer;font-size:13px}
.apitem:hover{background:var(--glass)}
.apitem input{width:auto;margin:0}
.loading{padding:60px;text-align:center;color:var(--text2);font-size:14px}
.spin{width:26px;height:26px;border:3px solid var(--border-s);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px;text-align:center;color:var(--text3);font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border-s);color:var(--text);padding:12px 20px;border-radius:var(--r2);font-size:13px;opacity:0;transition:all .25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.view{display:none}.view.active{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="logo">WFM<span>·</span>Adherence</div>
      <div class="sub" id="subline">Loading…</div>
    </div>
    <div class="hbtns">
      <button class="btn" id="csvBtn">Export CSV</button>
      <button class="btn primary" id="refreshBtn">↻ Refresh</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="matrix">Matrix</button>
    <button class="tab" data-view="leaderboard">Leaderboard</button>
    <button class="tab" data-view="daybreak">Day Breakdown</button>
    <button class="tab" data-view="mtd">MTD</button>
    <button class="tab" data-view="exceptions">Exceptions</button>
    <button class="tab" data-view="rules">Rules</button>
  </div>

  <!-- MATRIX -->
  <div class="view active" id="view-matrix">
    <div class="toolbar">
      <span class="tool-label">Metric</span>
      <div class="metricseg" id="metricSeg">
        <button data-m="late" class="on">Late</button>
        <button data-m="break">Break exceed</button>
        <button data-m="offline">Offline exceed</button>
        <button data-m="short">Early leave</button>
        <button data-m="overtime">Overtime</button>
        <button data-m="lost">Lost / compensate</button>
        <button data-m="shrink">Shrinkage %</button>
      </div>
      <div class="spacer"></div>
      <span class="tool-label">View</span>
      <div class="metricseg" id="rangeSeg">
        <button data-r="day">Day</button>
        <button data-r="week" class="on">Week</button>
        <button data-r="month">Month</button>
        <button data-r="all">All</button>
      </div>
      <button class="btn" id="rangePrev" title="Previous">‹</button>
      <span id="rangeLabel" style="font-size:12px;color:var(--text2);min-width:150px;text-align:center"></span>
      <button class="btn" id="rangeNext" title="Next">›</button>
      <div style="position:relative">
        <button class="btn" id="agentBtn">Agents ▾</button>
        <div class="agentpanel" id="agentPanel">
          <input id="agentSearch" placeholder="Search…"/>
          <div class="apbtns"><button class="btn" id="apAll">All</button><button class="btn" id="apNone">None</button></div>
          <div id="agentList"></div>
        </div>
      </div>
    </div>
    <div class="card"><div class="matrix-scroll" id="matrixScroll"><div class="loading"><div class="spin"></div>Reading the sheet…</div></div></div>
    <div class="legend" id="legend"></div>
  </div>

  <!-- MTD (month-to-date totals per agent) -->
  <div class="view" id="view-mtd">
    <div class="toolbar">
      <span class="tool-label">Month</span><select id="mtdMonth"></select>
      <div class="spacer"></div>
      <button class="btn" id="mtdCsv">Export CSV</button>
    </div>
    <div class="card"><div id="mtdWrap" class="empty">—</div></div>
  </div>

  <!-- LEADERBOARD -->
  <div class="view" id="view-leaderboard">
    <div class="card"><div id="leaderWrap" class="empty">—</div></div>
  </div>

  <!-- DAY BREAKDOWN -->
  <div class="view" id="view-daybreak">
    <div class="toolbar"><span class="tool-label">Date</span><select id="dayeSel"></select></div>
    <div class="card"><div id="dayWrap" class="empty">—</div></div>
  </div>

  <!-- EXCEPTIONS -->
  <div class="view" id="view-exceptions">
    <div class="exform">
      <div><label>Agent</label><select id="ex_agent" style="width:100%"></select></div>
      <div><label>Date</label><input id="ex_date" type="date" style="width:100%"/></div>
      <div><label>Rule</label><select id="ex_rule" style="width:100%">
        <option value="late">late (excuse lateness)</option>
        <option value="early_leave">early_leave (credit hours)</option>
        <option value="wrong_aux">wrong_aux (reclassify)</option>
        <option value="break">break (excuse break)</option>
        <option value="offline">offline (excuse offline)</option>
        <option value="">(blank = suppress all)</option>
      </select></div>
      <div><label>Minutes</label><input id="ex_min" type="number" placeholder="optional" style="width:100%"/></div>
      <div><label>From aux</label><input id="ex_from" placeholder="e.g. Upcoming Offline" style="width:100%"/></div>
      <div><label>To aux</label><input id="ex_to" placeholder="e.g. Meeting" style="width:100%"/></div>
      <div style="grid-column:1/-1"><label>Reason</label><input id="ex_reason" placeholder="e.g. transportation delay" style="width:100%"/></div>
      <div style="grid-column:1/-1"><button class="btn primary" id="ex_save">＋ Add exception</button></div>
    </div>
    <div class="card"><div id="excWrap" class="empty">—</div></div>
  </div>

  <!-- RULES -->
  <div class="view" id="view-rules">
    <div class="exform" id="rulesForm">
      <div><label>Shift length (hours)</label><input id="r_shift_hours" type="number" step="0.5"/></div>
      <div><label>Break target (min)</label><input id="r_break_target_min" type="number"/></div>
      <div><label>Break tolerance ± (min)</label><input id="r_break_tolerance_min" type="number"/></div>
      <div><label>Max single break (min)</label><input id="r_break_segment_max_min" type="number"/></div>
      <div><label>Min break segments</label><input id="r_break_min_segments" type="number"/></div>
      <div><label>Max break segments</label><input id="r_break_max_segments" type="number"/></div>
      <div><label>No-break edge window (min)</label><input id="r_break_edge_window_min" type="number"/></div>
      <div><label>Offline cap (min)</label><input id="r_offline_cap_min" type="number"/></div>
      <div><label>Late grace (min)</label><input id="r_late_grace_min" type="number"/></div>
      <div><label>Shift-split gap (min)</label><input id="r_shift_split_gap_min" type="number"/></div>
      <div><label>Roster match window (min)</label><input id="r_login_match_window_min" type="number"/></div>
      <div><label>Shrinkage mode</label><select id="r_shrinkage_mode" style="width:100%">
        <option value="unplanned">unplanned (excuse allowed break/offline)</option>
        <option value="gross">gross (all non-Available)</option>
      </select></div>
      <div style="grid-column:1/-1;display:flex;gap:10px;align-items:center">
        <button class="btn primary" id="rules_save">💾 Save rules</button>
        <span style="font-size:12px;color:var(--text3)">Saved to the sheet's <b>Config</b> tab and applied on refresh.</span>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
var DATA=null, METRIC='late', gserver=(typeof google!=='undefined'&&google.script&&google.script.run);
var rangeMode='week', anchorDate=null;
var hiddenAgents=new Set((JSON.parse(localStorage.getItem('wfm_hidden')||'[]')).map(String));
function saveHidden(){ localStorage.setItem('wfm_hidden', JSON.stringify(Array.from(hiddenAgents))); }

/* metric definitions -> how each cell reads */
var METRICS={
  late:{label:'Late (min)',get:c=>({v:c.lateMin,c:c.isLate?1:0,bad:c.isLate}),color:v=>heat(v,45),unit:'m'},
  break:{label:'Break over (min)',get:c=>({v:c.breakOverMin,c:c.breakExceeded?c.breakRules.length:0,bad:c.breakExceeded}),color:(v,c)=>c&&c.breakExceeded?heat(Math.max(v,10),40):'transparent',unit:'m'},
  offline:{label:'Offline over 20 (min)',get:c=>({v:c.offlineExcess,c:c.offlineExceeded?1:0,bad:c.offlineExceeded}),color:v=>heat(v,40),unit:'m'},
  short:{label:'Short shift (min)',get:c=>({v:c.shortfallMin,c:c.shortfallMin>0?1:0,bad:c.shortfallMin>0}),color:v=>heat(v,120),unit:'m'},
  overtime:{label:'Overtime (min)',get:c=>({v:c.overtimeMin||0,c:c.isOvertime?1:0,bad:false}),color:v=>heatPos(v,480),unit:'m'},
  lost:{label:'Lost / to compensate (min)',get:c=>({v:c.lostMin||0,c:(c.lostMin>0?1:0),bad:c.lostMin>0}),color:v=>heat(v,120),unit:'m'},
  shrink:{label:'Shrinkage %',get:c=>({v:c.buckets.shrinkagePct,c:0,bad:c.buckets.shrinkagePct>25}),color:v=>heat(v,40),unit:'%'}
};

function heat(v,max){ if(!v||v<=0)return 'transparent'; var t=Math.min(1,v/max); var a=.12+t*.5; return 'rgba(239,68,68,'+a.toFixed(2)+')'; }
function heatPos(v,max){ if(!v||v<=0)return 'transparent'; var t=Math.min(1,v/max); var a=.12+t*.5; return 'rgba(20,184,166,'+a.toFixed(2)+')'; }

/* ---------- boot ---------- */
function load(){
  showLoading();
  if(gserver){ google.script.run.withSuccessHandler(onData).withFailureHandler(onErr).getDashboardData({}); }
  else { onErr({message:'Open this as a deployed Apps Script web app (google.script.run unavailable).'}); }
}
function onErr(e){ document.getElementById('matrixScroll').innerHTML='<div class="empty">⚠ '+(e&&e.message||e)+'</div>'; }
function showLoading(){ document.getElementById('matrixScroll').innerHTML='<div class="loading"><div class="spin"></div>Reading the sheet…</div>'; }

function onData(d){
  DATA=d;
  if(d.dates.length && (!anchorDate || anchorDate>d.dates[d.dates.length-1] || anchorDate<d.dates[0]))
    anchorDate=d.dates[d.dates.length-1];
  fillDaySelector(d.dates);
  fillMtdMonth();
  fillAgentSelector(d.agents);
  renderAgentPicker();
  renderAll();
  renderExceptions();
  renderRules();
}

/* ---------- rules config ---------- */
var RULE_FIELDS=['shift_hours','break_target_min','break_tolerance_min','break_segment_max_min','break_min_segments','break_max_segments','break_edge_window_min','offline_cap_min','late_grace_min','shift_split_gap_min','login_match_window_min'];
function renderRules(){
  var r=DATA&&DATA.rules; if(!r)return;
  RULE_FIELDS.forEach(function(k){var el=document.getElementById('r_'+k);if(el&&r[k]!=null)el.value=r[k];});
  var sm=document.getElementById('r_shrinkage_mode'); if(r.shrinkage_mode)sm.value=r.shrinkage_mode;
}
function saveRules(){
  if(!gserver){toast('Deploy as web app to save rules');return;}
  var obj={};
  RULE_FIELDS.forEach(function(k){var el=document.getElementById('r_'+k);if(el&&el.value!=='')obj[k]=parseFloat(el.value);});
  obj.shrinkage_mode=document.getElementById('r_shrinkage_mode').value;
  toast('Saving rules…');
  google.script.run.withSuccessHandler(function(d){onData(d);toast('Rules saved ✓');}).withFailureHandler(onErr).saveConfig(obj);
}
function renderAll(){
  updateSub(); updateRangeLabel(); updateAgentBtn();
  renderMatrix(); renderLegend(); renderLeaderboard(); renderDay(); renderMTD();
}
function updateSub(){
  if(!DATA)return;
  document.getElementById('subline').textContent=
    visibleAgents().length+'/'+DATA.agents.length+' agents · '+visibleDates().length+' days shown · shrinkage: '+
    DATA.config.shrinkageMode+' · updated '+new Date(DATA.generatedAt).toLocaleTimeString();
}

/* ---------- date range (day / week / month / all) ---------- */
function pad2(n){return n<10?'0'+n:''+n;}
function ymdStr(dt){return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function rangeWindow(){
  var dates=DATA?DATA.dates:[]; if(!dates.length) return {from:null,to:null};
  if(rangeMode==='all') return {from:dates[0],to:dates[dates.length-1]};
  var a=parseYmd(anchorDate);
  if(rangeMode==='day') return {from:anchorDate,to:anchorDate};
  if(rangeMode==='week'){ var diff=(a.getDay()+6)%7; var mon=new Date(a); mon.setDate(a.getDate()-diff);
    var sun=new Date(mon); sun.setDate(mon.getDate()+6); return {from:ymdStr(mon),to:ymdStr(sun)}; }
  var f=new Date(a.getFullYear(),a.getMonth(),1), t=new Date(a.getFullYear(),a.getMonth()+1,0);
  return {from:ymdStr(f),to:ymdStr(t)};
}
function visibleDates(){ var w=rangeWindow(); return (DATA?DATA.dates:[]).filter(function(dt){return (!w.from||dt>=w.from)&&(!w.to||dt<=w.to);}); }
function visibleAgents(){ return (DATA?DATA.agents:[]).filter(function(a){return !hiddenAgents.has(String(a.id));}); }
function stepRange(dir){
  if(rangeMode==='all'||!DATA||!DATA.dates.length)return;
  var a=parseYmd(anchorDate);
  if(rangeMode==='day')a.setDate(a.getDate()+dir);
  else if(rangeMode==='week')a.setDate(a.getDate()+7*dir);

  if(c.offlineExceeded)tags+='<span class="tag">offline +'+c.offlineExcess+'m</span>';
  if(c.shortfallMin>0)tags+='<span class="tag">short '+c.shortfallMin+'m</span>';
  if(c.isOvertime)tags+='<span class="tag" style="background:var(--teal)">overtime '+hm(c.overtimeMin)+' ('+(c.offCode||'off')+')</span>';

      kv('Worked',hm(c.workedMin))+

      kv('Shrinkage duration',c.buckets.shrinkageMin+'m')+

    '</div>'+

      'Expected on-queue = '+DATA.config.shiftMinutes+'m − '+DATA.config.breakTarget+'m break − '+DATA.config.offlineCap+'m offline = <b>'+(DATA.config.shiftMinutes-DATA.config.breakTarget-DATA.config.offlineCap)+'m</b><br>'+
      '− Available '+c.buckets.productive+'m − productive aux (Calls/Meeting/Jira/Email) '+c.buckets.shrinkageAux+'m<br>'+
      '= <b style="color:var(--amber)">'+(c.lostMin||0)+'m lost</b>'+(c.isOvertime?' &nbsp;(overtime day — not counted)':'')+

/* agent-level summary over the currently visible window */
function agentDrill(aid){

  dts.forEach(function(dt){
    var c=DATA.cells[aid]&&DATA.cells[aid][dt]; if(!c)return;
    t.shifts++; t.brk+=c.totalBreak; t.shrinkMin+=c.buckets.shrinkageMin; t.shrinkPctSum+=c.buckets.shrinkagePct;
    t.off+=c.totalOffline; t.offExc+=c.offlineExcess; t.prod+=c.buckets.productive; t.nonprod+=c.buckets.nonProductive;
    if(c.isLate){t.lateCnt++;t.late+=c.lateMin;} if(c.breakExceeded)t.brkCnt++; if(c.offlineExceeded)t.offCnt++; if(c.shortfallMin>0)t.short+=c.shortfallMin;
    if(c.isOvertime){t.otDays++;t.otMin+=c.overtimeMin||0;}
    t.lost+=c.lostMin||0;
    rows.push({dt:dt,c:c});
  });
  var win=rangeMode==='all'?'all dates':(rangeMode==='day'?dts[0]:(dts[0]+' → '+dts[dts.length-1]));
  var body=rows.map(function(r){var c=r.c;var flags=[];if(c.isLate)flags.push('late '+c.lateMin+'m');if(c.breakExceeded)flags.push('break');if(c.offlineExceeded)flags.push('offline +'+c.offlineExcess+'m');if(c.shortfallMin>0)flags.push('short '+c.shortfallMin+'m');
    return '<div class="seg"><span class="t" style="min-width:78px">'+r.dt+'</span><span class="nm">brk '+c.totalBreak+'m · shrink '+c.buckets.shrinkageMin+'m ('+c.buckets.shrinkagePct+'%)</span><span class="t" style="color:'+(flags.length?'var(--red)':'var(--green)')+'">'+(flags.join(', ')||'ok')+'</span></div>';}).join('');
  document.getElementById('modalBox').innerHTML=
    '<span class="mclose" onclick="closeModal()">×</span>'+
    '<h3>'+a.name+'</h3><div class="sub">'+win+' · '+t.shifts+' shifts</div>'+
    '<div class="kv">'+
      kv('Total lost',hm(t.lost)+' ('+Math.round(t.lost)+'m)')+
      kv('Break duration',hm(t.brk))+
      kv('Shrinkage duration',hm(t.shrinkMin))+
      kv('Avg shrinkage %',(t.shifts?Math.round(t.shrinkPctSum/t.shifts*10)/10:0)+'%')+
      kv('Productive',hm(t.prod))+
      kv('Offline total',hm(t.off))+
      kv('Late',t.lateCnt+'× / '+Math.round(t.late)+'m')+
      kv('Break exceed',t.brkCnt+'×')+
      kv('Offline exceed',t.offCnt+'× / '+Math.round(t.offExc)+'m')+
      kv('Early leave',Math.round(t.short)+'m')+
      kv('Overtime',t.otDays+'× / '+hm(t.otMin))+
    '</div>'+
    '<div class="tool-label">Per-day</div><div class="timeline">'+(body||'<div class="empty">no shifts in window</div>')+'</div>';
  document.getElementById('modal').classList.add('open');
}

function exportMTD(){
  var month=document.getElementById('mtdMonth').value, rows=mtdRows(month);
  var head=['Agent','Shifts','Total lost / to compensate (min)','Late (min)','Early leave (min)','Break over (min)','Offline over (min)','Late count','Break exceed count','Offline exceed count','Break duration (min)','Shrinkage duration (min)','Avg shrinkage %','Overtime days','Overtime (min)'];
  var lines=[head].concat(rows.map(function(r){return [r.name,r.shifts,r.lost,r.late,r.short,r.brkOver,r.offExc,r.lateCnt,r.brkCnt,r.offCnt,r.brk,r.shrinkMin,r.shrinkPct,r.otDays,r.otMin];}));
  var csv=lines.map(function(r){return r.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='wfm_MTD_'+month+'.csv';a.click();URL.revokeObjectURL(u);
}

/* ---------- csv ---------- */
function exportCSV(){
  var d=DATA,m=METRICS[METRIC],dates=visibleDates(),agents=visibleAgents(),lines=[['Agent'].concat(dates).concat(['Total'])];
  agents.forEach(function(a){var row=[a.name],tot=0;dates.forEach(function(dt){var c=d.cells[a.id]&&d.cells[a.id][dt];var v=c?m.get(c).v:'';if(v)tot+=v;row.push(v);});row.push(Math.round(tot*10)/10);lines.push(row);});
  var csv=lines.map(function(r){return r.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='wfm_'+METRIC+'.csv';a.click();URL.revokeObjectURL(u);
}

/* ---------- ui wiring ---------- */
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2200);}
document.getElementById('metricSeg').addEventListener('click',function(e){if(e.target.dataset.m){METRIC=e.target.dataset.m;[].forEach.call(this.children,function(b){b.classList.toggle('on',b.dataset.m===METRIC);});renderMatrix();renderLegend();}});
document.getElementById('rangeSeg').addEventListener('click',function(e){if(e.target.dataset.r){rangeMode=e.target.dataset.r;[].forEach.call(this.children,function(b){b.classList.toggle('on',b.dataset.r===rangeMode);});renderAll();}});
document.getElementById('rangePrev').onclick=function(){stepRange(-1);};
document.getElementById('rangeNext').onclick=function(){stepRange(1);};
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});t.classList.add('active');document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById('view-'+t.dataset.view).classList.add('active');};});
/* agent picker */
document.getElementById('agentBtn').onclick=function(e){e.stopPropagation();document.getElementById('agentPanel').classList.toggle('open');};
document.getElementById('agentPanel').addEventListener('click',function(e){e.stopPropagation();});
document.getElementById('agentSearch').addEventListener('input',renderAgentPicker);
function afterAgentToggle(){updateAgentBtn();updateSub();renderMatrix();renderLeaderboard();renderDay();renderMTD();}
document.getElementById('agentList').addEventListener('change',function(e){var id=e.target.getAttribute('data-id');if(id==null)return;if(e.target.checked)hiddenAgents.delete(String(id));else hiddenAgents.add(String(id));saveHidden();afterAgentToggle();});
document.getElementById('apAll').onclick=function(){hiddenAgents.clear();saveHidden();renderAgentPicker();afterAgentToggle();};
document.getElementById('apNone').onclick=function(){DATA.agents.forEach(function(a){hiddenAgents.add(String(a.id));});saveHidden();renderAgentPicker();afterAgentToggle();};
document.addEventListener('click',function(){document.getElementById('agentPanel').classList.remove('open');});
document.getElementById('refreshBtn').onclick=load;
document.getElementById('csvBtn').onclick=exportCSV;
document.getElementById('ex_save').onclick=saveEx;
document.getElementById('rules_save').onclick=saveRules;
document.getElementById('mtdCsv').onclick=exportMTD;
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
load();
</script>
